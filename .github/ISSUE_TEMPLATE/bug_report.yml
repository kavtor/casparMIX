name: Bug report
description: Report a reproducible defect
title: "fix: "
labels: [bug, "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I understand a maintainer must approve this issue before a PR.
          required: true
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Include versions and platform.}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: Reproduction, expected and actual behavior}
    validations: {required: true}
  - type: textarea
    id: validation
    attributes: {label: Validation and affected area}
    validations: {required: true}
