name: Feature request
description: Propose a focused change
title: "feat: "
labels: [enhancement, "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I understand a maintainer must approve this issue before a PR.
          required: true
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the operator or developer need.}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: validation
    attributes: {label: Validation and affected area}
    validations: {required: true}
