name: Issue and PR governance
on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  issue-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: context.payload.pull_request.number})).data;
            const refs = [...(pr.body || '').matchAll(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi)];
            if (!refs.length) throw new Error('Link an approved issue using Closes #N.');
            for (const match of refs) {
              const issue = (await github.rest.issues.get({...context.repo, issue_number: Number(match[1])})).data;
              if (!issue.labels.some(x => (typeof x === 'string' ? x : x.name) === 'status:approved')) throw new Error('Linked issue requires status:approved.');
            }
            const types = pr.labels.filter(x => x.name.startsWith('type:'));
            if (types.length !== 1) throw new Error('Exactly one type:* label is required.');
